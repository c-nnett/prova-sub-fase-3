spring.application.name=agendabeleza-api
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema é responsabilidade do Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html

# E-mail. Local: Mailpit do docker-compose (SMTP 1025, interface em http://localhost:8025), sem autenticação nem TLS.
# Sem spring.mail.host o Boot não cria o JavaMailSender e o adaptador de notificações não sobe.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8
agendabeleza.notificacoes.remetente=nao-responda@agendabeleza.local
# Job da outbox: intervalo entre o fim de uma rodada e o início da seguinte (ISO 8601).
agendabeleza.notificacoes.envio-automatico=true
agendabeleza.notificacoes.intervalo-de-envio=PT1M

# Atrás do túnel e da plataforma em nuvem, a URL do feed .ics sai com o host e o esquema que o cliente usou
# (cabeçalhos X-Forwarded-*), e não com o endereço interno do contêiner.
server.forward-headers-strategy=framework
