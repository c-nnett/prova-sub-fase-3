# Perfil da nuvem (VPS da HostGator), ativado pela imagem "production" do Dockerfile.
# Aqui fica só o que muda no ambiente e não é segredo. Endereços e senhas chegam por variáveis de ambiente que o
# Terraform (infra/terraform) passa ao contêiner, e o Spring as lê sem citá-las aqui (relaxed binding):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD -> spring.datasource.*
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT -> spring.mail.* (Mailpit interno, sem porta pública)

# Logs sem cores: o Dockerfile liga SPRING_OUTPUT_ANSI_ENABLED para o terminal local, mas em produção os códigos de
# escape poluem o "docker logs". A propriedade do arquivo perde para a variável de ambiente, então a variável também
# é sobrescrita pelo Terraform.
logging.level.root=INFO
logging.level.br.com.fiap.agendabeleza=INFO

# O detalhe da saúde (banco, disco, e-mail) não fica público; só o status geral, usado pelo healthcheck.
management.endpoint.health.show-details=never
