name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agendabeleza-api
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o Sonar calcular código novo e blame

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache do SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, testes e cobertura (JaCoCo)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Análise no SonarCloud
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar

      - name: Relatórios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            agendabeleza-api/target/site/jacoco/
            agendabeleza-api/target/surefire-reports/
          if-no-files-found: ignore
